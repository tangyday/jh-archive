<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>ECK온라인강좌 가이드</title>

  <style>
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
  </style>
</head>
<body>
<style>
#eckv3-widget,
#eckv3-widget *,
#eckv3-widget *::before,
#eckv3-widget *::after {
  box-sizing: border-box;
}

#eckv3-widget {
  --eck-bg: #F5FCFF;
  --eck-surface: #FFFFFF;
  --eck-surface-2: #FBFDFF;
  --eck-border: #D9F1FA;
  --eck-border-soft: #EDF7FC;
  --eck-text: #0F2A3D;
  --eck-text-soft: #4C6B80;
  --eck-text-faint: #84A0B2;
  --eck-shadow-sm: 0 4px 12px rgba(10,95,160,.08);
  --eck-shadow-md: 0 14px 30px rgba(10,95,160,.12);
  --eck-shadow-lg: 0 24px 52px rgba(10,95,160,.16);
  --eckv3-text-body: 16px;
  --eckv3-text-small: 16px;
  --eckv3-text-caption: 12px;
  position: relative !important;
  z-index: 2147483000 !important;
  width: 100%;
  max-width: 758px;
  color: var(--eck-text);
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
}

#eckv3-widget .eckv3-shell { position: relative; }
#eckv3-widget .eckv3-launcher {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 2147483001;
  width: 64px;
  height: 64px;
  padding: 0;
  overflow: hidden;
  border: none;
  border-radius: 50%;
  background: linear-gradient(150deg, #319FD3 0%, #55BCE5 100%);
  color: #fff;
  font-size: 27px;
  box-shadow: var(--eck-shadow-lg);
  cursor: pointer;
  transition: transform .2s ease;
}
#eckv3-widget .eckv3-launcher:hover { transform: translateY(-2px) scale(1.03); }
#eckv3-widget .eckv3-launcher img,
#eckv3-widget .eckv3-logo img,
#eckv3-widget .eckv3-avatar img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

#eckv3-widget .eckv3-chat {
  position: fixed;
  right: 20px;
  bottom: 98px;
  z-index: 2147483003;
  display: flex;
  flex-direction: column;
  width: 386px;
  max-width: calc(100% - 24px);
  min-height: min(440px, calc(100vh - 130px));
  max-height: calc(100vh - 118px);
  overflow: hidden;
  border: 1px solid var(--eck-border);
  border-radius: 22px;
  background: rgba(255,255,255,.98);
  box-shadow: var(--eck-shadow-lg);
  backdrop-filter: blur(14px);
}
#eckv3-widget .eckv3-chat.eckv3-hidden { display: none; }

#eckv3-widget .eckv3-head {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: 0 0 auto;
  min-height: 64px;
  padding: 11px 14px;
  overflow: hidden;
  background: linear-gradient(120deg, #319FD3 0%, #55BCE5 42%, #82D8F1 72%, #A8E8F7 100%);
  color: #FFFFFF;
  box-shadow: 0 6px 18px rgba(39,139,184,.16);
}
#eckv3-widget .eckv3-head::after {
  content: '';
  position: absolute;
  top: -95px;
  right: -60px;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: rgba(255,255,255,.16);
  pointer-events: none;
}
#eckv3-widget .eckv3-brand {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
  font-weight: 700;
  letter-spacing: .01em;
}
#eckv3-widget .eckv3-logo {
  flex: 0 0 36px;
  width: 36px;
  height: 36px;
  padding: 2px;
  overflow: hidden;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 4px 12px rgba(41,142,183,.14), 0 0 0 1px rgba(255,255,255,.55);
}
#eckv3-widget .eckv3-brandText {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
#eckv3-widget .eckv3-brandTitle {
  color: #FFFFFF;
  font-size: 13.5px;
  font-weight: 750;
  line-height: 1.3;
  letter-spacing: -.01em;
  white-space: nowrap;
  text-shadow: 0 1px 2px rgba(15,91,128,.10);
}
#eckv3-widget .eckv3-brandSub {
  color: rgba(255,255,255,.90);
  font-size: 10px;
  font-weight: 500;
  line-height: 1.3;
  letter-spacing: -.01em;
  white-space: nowrap;
}
#eckv3-widget .eckv3-tools {
  position: relative;
  z-index: 1;
  display: flex;
  gap: 7px;
  flex: 0 0 auto;
}
#eckv3-widget .eckv3-tool {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border: 1px solid rgba(255,255,255,.30);
  border-radius: 9px;
  background: rgba(255,255,255,.18);
  color: #fff;
  font-size: 13px;
  cursor: pointer;
  transition: all .18s ease;
}
#eckv3-widget .eckv3-tool:hover {
  background: rgba(255,255,255,.24);
  transform: translateY(-1px);
}

#eckv3-widget .eckv3-body {
  display: flex !important;
  flex: 1 1 auto;
  flex-direction: column !important;
  min-height: 0;
  padding: 20px 14px;
  overflow-y: auto;
  background: linear-gradient(180deg, var(--eck-bg) 0%, var(--eck-surface) 100%);
  row-gap: 16px !important;
  scroll-behavior: smooth;
}
#eckv3-widget .eckv3-body > * { flex-shrink: 0 !important; }
#eckv3-widget .eckv3-msgRow {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  width: 100%;
}
#eckv3-widget .eckv3-msgRow.eckv3-bot { justify-content: flex-start; }
#eckv3-widget .eckv3-msgRow.eckv3-user { justify-content: flex-end; }
#eckv3-widget .eckv3-avatar {
  flex: 0 0 auto;
  width: 32px;
  height: 32px;
  overflow: hidden;
  border: 2px solid #EAF9FE;
  border-radius: 50%;
  background: linear-gradient(150deg, #319FD3 0%, #55BCE5 100%);
  box-shadow: 0 4px 10px rgba(10,95,160,.28);
  font-size: 15px;
}
#eckv3-widget .eckv3-bubble {
  max-width: 78%;
  padding: 13px 15px;
  border: 1px solid var(--eck-border);
  border-radius: 16px;
  box-shadow: var(--eck-shadow-sm);
  font-size: var(--eckv3-text-small);
  line-height: 1.6;
  white-space: pre-line;
}
#eckv3-widget .eckv3-bubble.eckv3-bot {
  background: var(--eck-surface);
  color: var(--eck-text);
  border-bottom-left-radius: 6px;
}
#eckv3-widget .eckv3-bubble.eckv3-user {
  background: linear-gradient(135deg, #58BEE9 0%, #78D2F2 100%);
  color: #073B5C;
  border-color: #58BEE9;
  border-bottom-right-radius: 6px;
  box-shadow: 0 8px 18px rgba(65,174,222,.18);
}

#eckv3-widget .eckv3-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
#eckv3-widget .eckv3-choice {
  min-height: 46px;
  padding: 11px 12px;
  border: 1px solid var(--eck-border);
  border-radius: 14px;
  background: var(--eck-surface);
  color: var(--eck-text);
  font-size: var(--eckv3-text-small);
  text-align: left;
  cursor: pointer;
  transition: all .18s ease;
}
#eckv3-widget .eckv3-choice:hover {
  border-color: #9DDFF3;
  background: #F2FCFF;
  box-shadow: 0 5px 13px rgba(72,181,226,.09);
  transform: translateY(-1px);
}

#eckv3-widget .eckv3-note,
#eckv3-widget .eckv3-helper {
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  outline: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
  width: auto !important;
  min-width: 0 !important;
  max-width: none !important;
  height: auto !important;
  min-height: 0 !important;
  border-radius: 0 !important;
  position: static !important;
  display: block !important;
  color: var(--eck-text-faint) !important;
  line-height: 1.6 !important;
  white-space: normal !important;
  overflow: visible !important;
}
#eckv3-widget .eckv3-note { font-size: var(--eckv3-text-caption) !important; }
#eckv3-widget .eckv3-helper { font-size: 12px !important; }
#eckv3-widget .eckv3-body > .eckv3-helper + .eckv3-cardStack { margin-top: 2px !important; }
#eckv3-widget .eckv3-body > .eckv3-note + .eckv3-navFoot { margin-top: 4px !important; }

#eckv3-widget .eckv3-rec {
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: 14px 14px 13px;
  border: 1px solid var(--eck-border);
  border-radius: 16px;
  background: var(--eck-surface);
  box-shadow: var(--eck-shadow-sm);
  transition: box-shadow .2s ease, transform .2s ease;
}
#eckv3-widget .eckv3-rec:hover {
  box-shadow: var(--eck-shadow-md);
  transform: translateY(-1px);
}
#eckv3-widget .eckv3-rec > .eckv3-pill { margin-left: 2px !important; }
#eckv3-widget .eckv3-rec .eckv3-ttl,
#eckv3-widget .eckv3-rec .eckv3-metaRow,
#eckv3-widget .eckv3-rec .eckv3-desc,
#eckv3-widget .eckv3-rec .eckv3-btns { margin-left: 2px !important; }
#eckv3-widget .eckv3-rec:not(.eckv3-pkgCard) .eckv3-ttl { margin-top: 1px !important; }
#eckv3-widget .eckv3-pkgCard .eckv3-ttl { margin-top: 2px !important; }
#eckv3-widget .eckv3-thumb {
  width: 100%;
  height: auto;
  margin-bottom: 2px;
  aspect-ratio: 16 / 9;
  border-radius: 12px;
  object-fit: contain;
  background: var(--eck-bg);
}
#eckv3-widget .eckv3-pill {
  display: inline-flex;
  align-self: flex-start;
  padding: 4px 10px;
  border: 1px solid #D2F1FA;
  border-radius: 999px;
  background: #F1FBFE;
  color: #2583A8;
  font-size: var(--eckv3-text-caption);
  font-weight: 700;
  letter-spacing: .02em;
}
#eckv3-widget .eckv3-ttl {
  color: var(--eck-text);
  font-size: var(--eckv3-text-body);
  font-weight: 700;
  letter-spacing: -.01em;
}
#eckv3-widget .eckv3-desc {
  color: var(--eck-text-soft);
  font-size: var(--eckv3-text-small);
  line-height: 1.6;
}
#eckv3-widget .eckv3-metaRow {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 4px;
}
#eckv3-widget .eckv3-metaChip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border: 1px solid var(--eck-border);
  border-radius: 999px;
  background: var(--eck-bg);
  color: var(--eck-text-soft);
  font-size: var(--eckv3-text-caption);
}
#eckv3-widget .eckv3-starIcons { color: #55CBEA; letter-spacing: 1px; font-size: 13px; }
#eckv3-widget .eckv3-pkgCard {
  border-color: #BDEAF7;
  background: linear-gradient(180deg, #F0FBFE, #FFFFFF);
}
#eckv3-widget .eckv3-pkgPill {
  border-color: #BDEAF7;
  background: #E9F9FD;
  color: #247C9E;
}
#eckv3-widget .eckv3-eckiTag { font-size: 15px; line-height: 1; }
#eckv3-widget .eckv3-cardStack { display: flex; flex-direction: column; gap: 12px; }
#eckv3-widget .eckv3-cardStack:empty { display: none; }
#eckv3-widget .eckv3-navBar {
  position: sticky;
  top: 0;
  z-index: 4;
  padding-bottom: 4px;
  background: linear-gradient(180deg, rgba(246,247,251,.97) 76%, rgba(246,247,251,0));
}
#eckv3-widget .eckv3-scrollBtns { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
#eckv3-widget .eckv3-navFoot {
  margin-top: 4px;
  padding-top: 10px;
  border-top: 1px dashed var(--eck-border);
}
#eckv3-widget .eckv3-moreBtn {
  width: 100%;
  justify-content: center;
  border-style: dashed;
  font-weight: 700;
}

#eckv3-widget .eckv3-btn,
#eckv3-widget .eckv3-btn.eckv3-small,
#eckv3-widget .eckv3-moreBtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 42px;
  padding: 10px 14px;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.2;
  cursor: pointer;
  transition: all .18s ease;
}
#eckv3-widget .eckv3-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
#eckv3-widget .eckv3-btn.eckv3-primary {
  background: linear-gradient(135deg, #48B8E5 0%, #71D0EF 55%, #9CE3F6 100%);
  color: #0B4864;
  box-shadow: 0 7px 16px rgba(46,157,204,.17);
}
#eckv3-widget .eckv3-btn.eckv3-ghost {
  border: 1px solid #CBEFFA;
  background: #FFFFFF;
  color: #319FD3;
}
#eckv3-widget .eckv3-btn.eckv3-enroll {
  background: linear-gradient(135deg, #48B8E5 0%, #71D0EF 55%, #9CE3F6 100%);
  color: #0B4864;
  box-shadow: 0 7px 16px rgba(46,157,204,.17);
}
#eckv3-widget .eckv3-btn.eckv3-ghost:hover,
#eckv3-widget .eckv3-btn.eckv3-primary:hover,
#eckv3-widget .eckv3-btn.eckv3-enroll:hover { transform: translateY(-1px); }
#eckv3-widget .eckv3-enrollBtn,
#eckv3-widget .eckv3-pkgLinkBtn { border-radius: 999px; }
#eckv3-widget .eckv3-btn.eckv3-enroll,
#eckv3-widget .eckv3-btn.eckv3-pkgDetail,
#eckv3-widget .eckv3-pkgCard .eckv3-btn.eckv3-primary {
  padding: 8px 12px !important;
  border-radius: 10px !important;
  font-size: 14px !important;
}

#eckv3-widget .eckv3-foot {
  flex: 0 0 auto;
  padding: 12px 14px;
  border-top: 1px solid var(--eck-border-soft);
  background: var(--eck-surface-2);
}
#eckv3-widget .eckv3-fake {
  padding: 12px 14px;
  border: 1px solid var(--eck-border);
  border-radius: 16px;
  background: var(--eck-surface);
  color: var(--eck-text-faint);
  font-size: var(--eckv3-text-small);
}
#eckv3-widget .eckv3-tiny {
  flex: 0 0 auto;
  padding: 0 0 10px;
  color: var(--eck-text-faint);
  font-size: 12px;
  text-align: center;
}
#eckv3-widget .eckv3-searchWrap { display: flex; gap: 8px; }
#eckv3-widget .eckv3-searchInput {
  flex: 1;
  min-width: 0;
  padding: 12px 14px;
  border: 1px solid var(--eck-border);
  border-radius: 999px;
  background: var(--eck-surface);
  color: var(--eck-text);
  font-size: var(--eckv3-text-small);
}
#eckv3-widget .eckv3-searchInput:focus {
  outline: none;
  border-color: #9EDDF2;
  box-shadow: 0 0 0 4px rgba(72,184,229,.10);
}
#eckv3-widget .eckv3-searchBtn {
  white-space: nowrap;
  border: 1px solid #CBEFFA;
  border-radius: 999px;
  background: #FFFFFF;
  color: #319FD3;
}

#eckv3-widget .eckv3-launcherTip {
  position: fixed;
  right: 20px;
  bottom: 96px;
  z-index: 2147483002;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  max-width: 200px;
  padding: 11px 12px 11px 14px;
  border: 1px solid #A6E3F5;
  border-radius: 16px;
  background: #fff;
  color: #0B4864;
  box-shadow: 0 12px 26px rgba(10,95,160,.18);
  font-size: 13px;
  font-weight: 600;
  line-height: 1.45;
  letter-spacing: -.01em;
  text-align: left;
  cursor: pointer;
  animation: eckv3TipFloat 2.6s ease-in-out infinite;
}
#eckv3-widget .eckv3-launcherTip::after {
  content: '';
  position: absolute;
  right: 22px;
  bottom: -8px;
  width: 14px;
  height: 14px;
  transform: rotate(45deg);
  background: #fff;
  border-right: 1px solid #A6E3F5;
  border-bottom: 1px solid #A6E3F5;
}
#eckv3-widget .eckv3-launcherTip.eckv3-hidden { display: none; }
#eckv3-widget .eckv3-launcherTipText { flex: 1 1 auto; font-weight: 400 !important; }
#eckv3-widget .eckv3-launcherTipClose {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #EAF7FD;
  color: #5A8DA6;
  font-size: 10px;
  line-height: 1;
  cursor: pointer;
}
#eckv3-widget .eckv3-launcherTipClose:hover { background: #D3EEF9; color: #0B4864; }
@keyframes eckv3TipFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

@media (max-width: 640px) {
  #eckv3-widget { width: 100%; max-width: 100%; }
  #eckv3-widget .eckv3-launcher {
    right: 14px;
    bottom: max(14px, env(safe-area-inset-bottom));
    width: 58px;
    height: 58px;
    font-size: 24px;
  }
  #eckv3-widget .eckv3-chat {
    left: 8px;
    right: 8px;
    bottom: calc(80px + env(safe-area-inset-bottom));
    width: auto;
    max-width: none;
    min-height: min(420px, calc(100dvh - 110px - env(safe-area-inset-bottom)));
    max-height: calc(100dvh - 96px - env(safe-area-inset-bottom));
    border-radius: 18px;
  }
  #eckv3-widget .eckv3-head { min-height: 64px; padding: 13px 12px; }
  #eckv3-widget .eckv3-logo { width: 36px; height: 36px; flex-basis: 36px; }
  #eckv3-widget .eckv3-brand { gap: 9px; }
  #eckv3-widget .eckv3-brandTitle { font-size: 13px; }
  #eckv3-widget .eckv3-brandSub { font-size: 10px; }
  #eckv3-widget .eckv3-tools { gap: 5px; }
  #eckv3-widget .eckv3-tool { width: 29px; height: 29px; }
  #eckv3-widget .eckv3-body { padding: 14px 10px; row-gap: 12px !important; }
  #eckv3-widget .eckv3-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  #eckv3-widget .eckv3-bubble { max-width: 84%; padding: 11px 12px; font-size: 13px; line-height: 1.55; }
  #eckv3-widget .eckv3-avatar { width: 29px; height: 29px; }
  #eckv3-widget .eckv3-choice { min-height: 43px; padding: 10px 11px; font-size: 13px; }
  #eckv3-widget .eckv3-rec { gap: 6px; padding: 12px; border-radius: 14px; }
  #eckv3-widget .eckv3-ttl { font-size: 14px; overflow-wrap: anywhere; word-break: keep-all; }
  #eckv3-widget .eckv3-desc { font-size: 12px; line-height: 1.55; overflow-wrap: anywhere; }
  #eckv3-widget .eckv3-thumb { max-width: 100%; height: auto; }
  #eckv3-widget .eckv3-btns { gap: 6px; }
  #eckv3-widget .eckv3-btn,
  #eckv3-widget .eckv3-btn.eckv3-small,
  #eckv3-widget .eckv3-moreBtn {
    min-height: 42px;
    padding: 10px 14px;
    font-size: 15px;
    line-height: 1.2;
  }
  #eckv3-widget .eckv3-foot { padding: 10px; }
  #eckv3-widget .eckv3-searchWrap { gap: 6px; align-items: stretch; }
  #eckv3-widget .eckv3-searchInput { width: 100%; min-width: 0; padding: 11px 12px; font-size: 13px; }
  #eckv3-widget .eckv3-searchBtn { flex: 0 0 auto; padding: 0 13px; font-size: 12px; }
  #eckv3-widget .eckv3-tiny { padding: 0 0 calc(8px + env(safe-area-inset-bottom)); font-size: 10.5px; }
  #eckv3-widget .eckv3-metaRow { gap: 5px; }
  #eckv3-widget .eckv3-metaChip { padding: 3px 8px; font-size: 10.5px; }
  #eckv3-widget .eckv3-launcherTip {
    right: 14px;
    bottom: calc(80px + env(safe-area-inset-bottom));
    max-width: 180px;
    font-size: 12.5px;
  }
  #eckv3-widget .eckv3-launcherTip::after { right: 20px; }
}

    function packagesForLang(lang) {
      // 한국어 TOPIK 패키지는 일반 언어(기타 언어) 패키지에서 제외하고
      // 한국어 / 외국인을 위한 강좌 흐름에서만 보여줍니다.
      const list = packages.filter(p => p.langs.includes(lang) && !(p.exams || []).includes('TOPIK'));
      if(!list.length) return [];
      const exam = state.exam;
      const purpose = state.purpose;
      return list.slice().sort((a,b)=>{
        const aExam = exam && a.exams && a.exams.includes(exam) ? 0 : 1;
        const bExam = exam && b.exams && b.exams.includes(exam) ? 0 : 1;
        if(aExam !== bExam) return aExam - bExam;
        const aPurpose = purpose && a.purposes && a.purposes.includes(purpose) ? 0 : 1;
        const bPurpose = purpose && b.purposes && b.purposes.includes(purpose) ? 0 : 1;
        if(aPurpose !== bPurpose) return aPurpose - bPurpose;
        return 0;
      });
    }

    function courseUrl(title) {
      if(courseUrls[title]) return courseUrls[title];
      return `${COURSE_SEARCH_BASE}?keyword=${encodeURIComponent(title)}`;
    }
    // 새 카드나 말풍선이 추가되면 [이전 단계 / 처음으로]를 항상 맨 아래로 다시 내립니다.
    function keepNavLast() {
      if(state.navEl && state.navEl.parentNode === body && body.lastElementChild !== state.navEl) {
        body.appendChild(state.navEl);
      }
    }
    // 화면 전환(render) 중에는 요소가 하나씩 추가될 때 발생하는 자동 스크롤을 막습니다.
    // 렌더링이 끝난 뒤 현재 화면의 첫 말풍선/메뉴부터 보이도록 최상단에 맞춥니다.
    let isRenderingScreen = false;
    // 추천 강좌의 [더보기]처럼 화면 안에서 콘텐츠를 추가할 때만 새 카드 위치로 이동합니다.
    let focusTarget = null;
    function setFocusTarget(el) { focusTarget = el || null; }
    function scrollToFocus() {
      if(!focusTarget || !body.contains(focusTarget)) return false;
      const top = body.scrollTop + focusTarget.getBoundingClientRect().top - body.getBoundingClientRect().top - 8;
      body.scrollTo({top: Math.max(0, top), behavior:'smooth'});
      return true;
    }
    function scrollToLatest(force=false) {
      keepNavLast();
      // render()가 화면을 새로 구성하는 동안에는 중간 요소 추가로 인한 자동 스크롤을 실행하지 않습니다.
      if(isRenderingScreen) return;
      requestAnimationFrame(()=>{
        if(scrollToFocus()) return;
        if(force) body.scrollTo({top:body.scrollHeight, behavior:'smooth'});
        else if(body.scrollHeight - body.scrollTop - body.clientHeight < 220) body.scrollTo({top:body.scrollHeight, behavior:'smooth'});
      });
    }
    function scrollToTop() { body.scrollTo({top:0, behavior:'smooth'}); }
    // 카드를 batch 개씩만 먼저 보여주고, 아래 [더보기] 버튼으로 다음 묶음을 이어서 그립니다.
    function appendMoreBlock(pool, batch, renderItem) {
      const holder = document.createElement('div');
      holder.className = 'eckv3-cardStack';
      body.appendChild(holder);
      const btnWrap = document.createElement('div');
      btnWrap.className = 'eckv3-btns';
      body.appendChild(btnWrap);
      let shown = 0;
      function reveal() {
        const startCount = holder.children.length;
        pool.slice(shown, shown + batch).forEach((item, i) => renderItem(item, shown + i, holder));
        shown = Math.min(shown + batch, pool.length);
        paint();
        // 이번에 새로 보여준 카드 중 첫 번째를 화면 위쪽에 맞춰 줍니다.
        setFocusTarget(holder.children[startCount] || holder.firstElementChild);
        scrollToLatest();
      }
      function paint() {
        btnWrap.innerHTML = '';
        const left = pool.length - shown;
        if(left <= 0) return;
        const b = document.createElement('button');
        b.className = 'eckv3-btn eckv3-ghost eckv3-moreBtn';
        b.textContent = `＋ 더보기 (${left}개 더 있어요)`;
        b.onclick = reveal;
        btnWrap.appendChild(b);
      }
      reveal();
      return holder;
    }
    function appendBottomNav() {
      state.navDone = true;
      if(state.navEl && state.navEl.parentNode === body) { keepNavLast(); return; }
      const actions = document.createElement('div');
      actions.className='eckv3-btns eckv3-navFoot';
      actions.innerHTML='<button class="eckv3-btn eckv3-ghost">이전 단계</button><button class="eckv3-btn eckv3-primary">처음으로</button>';
      const buttons = actions.querySelectorAll('button');
      buttons[0].onclick = goBack;
      buttons[1].onclick = resetAll;
      body.appendChild(actions);
      state.navEl = actions;
      scrollToLatest(true);
    }
    function purposeList(lang) {
      const set = new Set([...Object.keys(catalog[lang]||{})]);
      if(examCatalog[lang] && Object.keys(examCatalog[lang]).length) set.add('시험 대비');
      return purposeOrder.filter(p=>set.has(p));
    }
    function levelList(lang, purpose) {
      const levels = Object.keys((catalog[lang]||{})[purpose] || {});
      return levels.slice().sort((a,b) => orderIndex(LEVEL_ORDER, a) - orderIndex(LEVEL_ORDER, b));
    }
    function examList(lang) { return Object.keys(examCatalog[lang] || {}); }
    function targetList(lang, exam) {
      const keys = Object.keys(((examCatalog[lang]||{})[exam]) || {});
      return keys.slice().sort((a,b) => orderIndex(TARGET_ORDER, a) - orderIndex(TARGET_ORDER, b));

        // 외국인을 위한 강좌 > 중국어 > 한국어는 '회화 및 문법 / 비즈니스' 분류를 반드시 표시
        const forcePurposeSplit = ['중국어','한국어'].includes(state.fBase) && state.fTarget === '한국어';
        if(fTotalAll <= SIMPLE_MAX && !forcePurposeSplit) {
          state.step='fResult';

        } else {

          grid(fPurposes, chooseForeignerPurpose);

        }
        const fLevels = fLevelList(state.fBase, state.fTarget, state.fPurpose);
        const fTotalPurpose = fCardsForPurposeAll(state.fBase, state.fTarget, state.fPurpose).length;
        if(fTotalPurpose <= SIMPLE_MAX) {
          state.step='fResult';
          return showForeignerResult(fCardsForPurposeAll(state.fBase, state.fTarget, state.fPurpose), '선택하신 학습 목적에 알맞은 강좌를 추천해드릴게요!');
        }
        if(fLevels.length <= 1) {
          state.fLevel = fLevels[0] || null;
        } else {
          bubble('현재 수준을 선택해 주세요.');
          grid(fLevels, chooseForeignerLevel);
          if(!state.fLevel) return;
          bubble(state.fLevel, 'user');
        }
        state.step='fResult';
        showForeignerResult();
        return;
      }
      if(state.step==='korean') {
        bubble('한국어', 'user');
        bubble('외국인 학습자를 위한 한국어 강좌예요. 어떤 언어로 배우고 싶으신가요?');
        // 한국어를 항상 맨 앞에 두고, 나머지는 강좌 수가 많은 순서로 정렬합니다.
        const kBases = kBaseList().sort((a,b)=>{
          if(a==='한국어') return -1;
          if(b==='한국어') return 1;
          return kBaseCount(b)-kBaseCount(a);
        });
        grid(kBases, chooseKoreanBase);

      }

        bubble(state.kBase, 'user');
        const kPurposes = kPurposeList(state.kBase);
        const kTotalAll = kCardsForBaseAll(state.kBase).length;
        // 한국어 > 중국어도 강좌 수와 관계없이 '회화 및 문법 / 비즈니스' 목적 분류를 반드시 표시
        const forceKoreanPurposeSplit = ['중국어','한국어'].includes(state.kBase);
        if(kTotalAll <= SIMPLE_MAX && !forceKoreanPurposeSplit) {
          state.step='kResult';
          return showKoreanResult(kCardsForBaseAll(state.kBase), '선택하신 언어에 맞는 강좌를 추천해드릴게요!');
        }
        if(kPurposes.length <= 1) {
          state.kPurpose = kPurposes[0] || null;
        } else {
          bubble('학습 목적을 선택해 주세요.');
          grid(kPurposes, chooseKoreanPurpose);
          if(!state.kPurpose) return;
          bubble(state.kPurpose, 'user');
        }
        const kLevels = kLevelList(state.kBase, state.kPurpose);
        const kTotalPurpose = kCardsForPurposeAll(state.kBase, state.kPurpose).length;
        if(kTotalPurpose <= SIMPLE_MAX) {
          state.step='kResult';
          return showKoreanResult(kCardsForPurposeAll(state.kBase, state.kPurpose), '선택하신 학습 목적에 알맞은 강좌를 추천해드릴게요!');
        }
        if(kLevels.length <= 1) {
          state.kLevel = kLevels[0] || null;
        } else {
          bubble('현재 수준을 선택해 주세요.');
          grid(kLevels, chooseKoreanLevel);
          if(!state.kLevel) return;
          bubble(state.kLevel, 'user');
        }
        state.step='kResult';
        showKoreanResult();
        return;
      }
      if(state.step==='extraLang') {
        bubble('기타 언어', 'user');
        renderRegionSection();
        return;
      }
      bubble(state.lang, 'user');
      const purposes = purposeList(state.lang);
      const hasLangPackages = packagesForLang(state.lang).length > 0;
      if(purposes.length <= 1 && !hasLangPackages) {
        state.purpose = purposes[0] || null;
      } else {
        bubble('학습 목적을 선택해 주세요.');
        const options = hasLangPackages ? [...purposes, '📦 패키지'] : purposes;
        const choices = grid(options, label => label==='📦 패키지' ? choosePackagePurpose() : choosePurpose(label));
        if(hasLangPackages) {
          const packageChoice = Array.from(choices.querySelectorAll('button')).find(b => b.textContent==='📦 패키지');

      if(state.purpose==='시험 대비') {

          return showResult(cardsForExamPurpose(state.lang), '선택하신 학습 목적에 알맞은 강좌를 추천해드릴게요!');

        // IM → IH → AL을 우선 노출하고, 나머지 OPIc 강좌는 [더보기]에서 이어집니다.
        if(state.lang === '영어' && state.exam === 'OPIc') {
          const priority = ['The 빠른 OPIc IM', 'The 빠른 OPIc IH', 'The 빠른 OPIc AL'];
          let opicCards = cardsForExamAll(state.lang, state.exam);
          opicCards = opicCards.slice().sort((a, b) => {
            const ai = priority.indexOf(a[0]);
            const bi = priority.indexOf(b[0]);
            const ar = ai === -1 ? priority.length : ai;
            const br = bi === -1 ? priority.length : bi;
            return ar - br;
          });
          state.target = null;
          return showResult(opicCards, '영어 OPIc 강좌를 추천 순서대로 보여드릴게요!');
        }

        // 영어 > 시험 대비 > TOEIC Speaking도 목표 등급 분류를 생략하고 강좌를 바로 보여줍니다.
        // IM → IH → 실전모의고사를 우선 노출하고, 나머지는 [더보기]에서 이어집니다.
        if(state.lang === '영어' && state.exam === 'TOEIC Speaking') {
          const priority = [
            'The 빠른 Toeic Speaking - IM',
            'The 빠른 Toeic Speaking - IH',
            'The 빠른 Toeic Speaking - 실전모의고사'
          ];
          let toeicSpeakingCards = cardsForExamAll(state.lang, state.exam);
          toeicSpeakingCards = toeicSpeakingCards.slice().sort((a, b) => {
            const ai = priority.indexOf(a[0]);
            const bi = priority.indexOf(b[0]);
            const ar = ai === -1 ? priority.length : ai;
            const br = bi === -1 ? priority.length : bi;
            return ar - br;
          });
          state.target = null;
          return showResult(toeicSpeakingCards, '영어 TOEIC Speaking 강좌를 추천 순서대로 보여드릴게요!');
        }

        if(totalExamCards <= 3 && totalExamCards > 0 && !state.target) {
          return showResult(cardsForExam(state.lang, state.exam), '선택하신 시험에 맞는 강좌를 추천해드릴게요!');
        }
        const targets = targetList(state.lang, state.exam);
        if(targets.length <= 1) {
          state.target = targets[0] || null;
        } else {
          bubble('목표 등급 또는 트랙을 선택해 주세요. 강좌명 기준으로 실제 있는 값만 보여드려요.');
          grid(targets, chooseTarget);
          if(!state.target) return;
          bubble(state.target, 'user');
        }
        return showResult();
      }
      const purposeCards = cardsForPurpose(state.lang, state.purpose);
      const totalPurposeCards = cardsForPurposeAll(state.lang, state.purpose).length;
      if(DIRECT_PURPOSES.includes(state.purpose)) {
        return showResult(purposeCards, '선택하신 학습 목적에 알맞은 강좌를 추천해드릴게요!');
      }
      if(totalPurposeCards <= 3 && totalPurposeCards > 0 && !state.target) {
        return showResult(purposeCards, '선택하신 학습 목적에 알맞은 강좌를 추천해드릴게요!');
      }
      const levels = levelList(state.lang, state.purpose);
      if(levels.length <= 1) {
        state.target = levels[0] || null;
      } else {
        bubble('현재 수준 또는 시작 단계를 선택해 주세요. 이 언어와 목적에 실제 있는 단계만 보여드려요.');
        grid(levels, chooseTarget);
        if(!state.target) return;
        bubble(state.target, 'user');
      }
      showResult();
    }
    function chooseLang(label) {
      if(label==='기타 언어') { state.region=null; state.step='extraLang'; render(); return; }
      if(label==='이문화 특강') { state.cultureCountry=null; state.step='culture'; render(); return; }
      if(label==='외국인을 위한 강좌') { state.fBase=null; state.fTarget=null; state.fPurpose=null; state.fLevel=null; clearFPicked(); state.step='foreigner'; render(); return; }
      if(label==='한국어') { state.kBase=null; state.kPurpose=null; state.kLevel=null; clearKPicked(); state.step='korean'; render(); return; }
      state.lang=label; state.purpose=null; state.exam=null; state.target=null; state.region=null; clearPicked(); state.step='purpose'; render();
    }
    function chooseCultureCountry(country) { state.cultureCountry=country; state.step='culture'; render(); }
    function showCultureResult(country) {
      const titles = cultureCatalog[country] || [];
      if(!titles.length) { bubble('추천할 강좌를 아직 찾지 못했어요.'); appendBottomNav(); return; }
      appendMoreBlock(titles, PAGE_MAIN, (t, idx, holder) => {
        const meta = titleMeta(t);
        recCard(idx===0 ? '이문화 특강' : '추가 추천', t, `문화 특강 · ${meta.level}`, '언어 실력과 상관없이 가볍게 즐길 수 있는 문화 강좌예요.', holder);
      });
      appendBottomNav();
    }
    function fTotalCount() {
      let n=0;
      Object.values(foreignerCatalog).forEach(t=>Object.values(t).forEach(p=>Object.values(p).forEach(l=>Object.values(l).forEach(arr=>{n+=arr.length;}))));
      return n;
    }
    function fBaseCount(base) {
      let n=0;
      Object.values(foreignerCatalog[base]||{}).forEach(p=>Object.values(p).forEach(l=>Object.values(l).forEach(arr=>{n+=arr.length;})));
      return n;
    }
    // 학습모어를 고른 뒤 나오는 '배우고 싶은 언어' 목록입니다.
    // 한국어를 항상 맨 앞에 두고, 나머지는 원래 순서를 유지합니다.
    function fTargetList(base) {
      const keys = Object.keys(foreignerCatalog[base] || {});
      return keys.slice().sort((a,b)=>{
        if(a==='한국어') return -1;
        if(b==='한국어') return 1;
        return 0;
      });
    }
    function fPurposeList(base, target) { return Object.keys(((foreignerCatalog[base]||{})[target]) || {}); }
    function fLevelList(base, target, purpose) {
      const keys = Object.keys((((foreignerCatalog[base]||{})[target]||{})[purpose]) || {});
      return keys.slice().sort((a,b) => orderIndex(LEVEL_ORDER, a) - orderIndex(LEVEL_ORDER, b));
    }
    function fCardsForPurposeAll(base, target, purpose) {
      const levels = fLevelList(base, target, purpose);
      return uniqueCards(levels.flatMap(level => ((((foreignerCatalog[base]||{})[target]||{})[purpose]||{})[level]) || []));
    }
    function fCardsForComboAll(base, target) {
      const purposes = fPurposeList(base, target);
      return uniqueCards(purposes.flatMap(purpose => fCardsForPurposeAll(base, target, purpose)));
    }
    function fCardsForLevel(base, target, purpose, level) {
      return ((((foreignerCatalog[base]||{})[target]||{})[purpose]||{})[level]) || [];
    }
    function chooseForeignerBase(label) { state.fBase=label; state.fTarget=null; state.fPurpose=null; state.fLevel=null; clearFPicked(); state.step='fTarget'; render(); }
    function chooseForeignerTarget(label) { state.fTarget=label; state.fPurpose=null; state.fLevel=null; state.fPicked={target:true,purpose:false,level:false}; state.step='fPurpose'; render(); }
    function chooseForeignerPurpose(label) { state.fPurpose=label; state.fLevel=null; state.fPicked.purpose=true; state.fPicked.level=false; state.step='fLevel'; render(); }
    function chooseForeignerLevel(label) { state.fLevel=label; state.fPicked.level=true; state.step='fResult'; render(); }
    // foreignerCatalog 기반(외국인을 위한 강좌 / 한국어 전용) 흐름에서 "시리즈 강좌 보기"에 쓸
    // 같은 base+target+purpose 안의 다른 단계(레벨) 강좌 목록을 반환합니다.
    function fSeriesTitles(base, target, purpose, level, excludeTitles=[]) {
      if(!base || !target || !purpose) return [];
      const levels = fLevelList(base, target, purpose);
      if(levels.length <= 1) return [];
      const titles = levels.filter(l=>l!==level).flatMap(l => fCardsForLevel(base, target, purpose, l).map(x=>x[0]));
      return sortTitlesByStars(excludeKnownTitles(uniqueCards(titles.map(t=>[t])).map(x=>x[0]), excludeTitles));
    }
    // "이런 강좌도 있어요"에 쓸, 같은 base+target 안의 다른 학습 목적(purpose) 강좌 목록을 반환합니다.
    function fAdjacentTitles(base, target, purpose, excludeTitles=[]) {
      if(!base || !target) return [];
      const purposes = fPurposeList(base, target).filter(p=>p!==purpose);
      if(!purposes.length) return [];
      const titles = purposes.flatMap(p => fCardsForPurposeAll(base, target, p).map(x=>x[0]));
      return sortTitlesByStars(excludeKnownTitles(uniqueCards(titles.map(t=>[t])).map(x=>x[0]), excludeTitles));
    }
    // showExtraRecommendations()의 foreignerCatalog 버전. 외국인을 위한 강좌 / 한국어 전용 흐름 결과 하단에
    // "시리즈 강좌 보기" · "이런 강좌도 있어요" · "패키지 보기" 버튼을 필요할 때 추가합니다.
    function foreignPackages(base, target) {
      if(target !== '한국어') return packagesForLang(target);
      return packages.filter(p => (p.exams || []).includes('TOPIK') && (p.langs || []).includes(base));
    }
    function showForeignPackages(base, target) {
      const list = foreignPackages(base, target);
      if(!list.length) { bubble('현재 선택하신 언어권의 한국어 TOPIK 패키지는 준비된 정보가 없어요.'); return; }
      const foreignPackageIntroRow = bubble(`📦 ${base} 학습자를 위한 한국어 TOPIK 패키지예요.`);
      foreignPackageIntroRow.style.setProperty('margin-top','12px','important');
      appendMoreBlock(list, PAGE_MAIN, (p, idx, holder) => pkgCard(p, holder));
      appendBottomNav();
    }
    function showExtraRecommendationsForeign(base, target, purpose, level, shownTitles=[]) {
      const foreignPkgList = foreignPackages(base, target);
      // 한국어 학습 경로에서는 목적 분류와 관계없이 해당 언어권의 TOPIK 패키지를 노출합니다.
      // 따라서 베트남어 > 한국어의 회화 및 문법 / TOPIK / 비즈니스 / 문화 / OPIc 모두 패키지 보기가 표시됩니다.
      const hasPackages = foreignPkgList.length > 0;
      state.currentShownTitles = (shownTitles || []).slice();
      state.extraShownTitles = [];
      const seriesTitles = fSeriesTitles(base, target, purpose, level, state.currentShownTitles);
      const hasSeries = seriesTitles.length > 0;
      const hasSimilar = fAdjacentTitles(base, target, purpose, state.currentShownTitles).length > 0;
      if(!hasSeries && !hasSimilar && !hasPackages) return;
      const wrap = document.createElement('div'); wrap.className='eckv3-btns';
      wrap.innerHTML = (hasSeries ? '<button class="eckv3-btn eckv3-ghost" id="eckv3-fSeriesBtn">시리즈 강좌 보기</button>' : '')
        + (hasSimilar ? '<button class="eckv3-btn eckv3-ghost" id="eckv3-fSimilarBtn">🔎 이런 강좌도 있어요</button>' : '')
        + (hasPackages ? '<button class="eckv3-btn eckv3-primary" id="eckv3-fPackageBtn">📦 패키지 보기</button>' : '');
      body.appendChild(wrap);
      if(hasSeries) eckv3ById('eckv3-fSeriesBtn').onclick = () => {
        const exclude = [...(state.currentShownTitles||[]), ...(state.extraShownTitles||[])];
        const titles = fSeriesTitles(base, target, purpose, level, exclude);
        if(!titles.length) return bubble('같은 시리즈 안에서는 방금 추천드린 강좌 외에 이어볼 만한 강좌가 많지 않아요.');
        bubble('방금 위에 제시한 추천을 제외하고, 같은 시리즈(다른 단계)에서 함께 보면 좋은 강좌예요.');
        state.extraShownTitles = [...(state.extraShownTitles||[]), ...titles];
        appendMoreBlock(titles, PAGE_MORE, (t, i, holder)=> recCard(i===0 ? '시리즈 추천' : '연계 추천', t, `${titleMeta(t).purpose} · ${titleMeta(t).level}`, '같은 시리즈 안에서 자연스럽게 이어지는 강좌예요.', holder));
      };
      if(hasSimilar) eckv3ById('eckv3-fSimilarBtn').onclick = () => {
        const exclude = [...(state.currentShownTitles||[]), ...(state.extraShownTitles||[])];
        const titles = fAdjacentTitles(base, target, purpose, exclude);
        if(!titles.length) return bubble('방금 드린 추천 외에는 함께 볼 만한 다른 목적의 강좌가 많지 않아요.');
        bubble('✨ 찾아본 결과, 방금 추천을 제외하고도 같은 언어 조합 안에서 함께 검토할 수 있는 강좌가 더 있어요.');
        state.extraShownTitles = [...(state.extraShownTitles||[]), ...titles];
        appendMoreBlock(titles, PAGE_MORE, (t, i, holder)=> recCard(i===0 ? '함께 추천' : '추가 추천', t, `${titleMeta(t).purpose} · ${titleMeta(t).level}`, '현재 선택과 가까운 목적 또는 단계의 강좌예요.', holder));
      };
      const packageBtn = eckv3ById('eckv3-fPackageBtn');
      if(packageBtn) packageBtn.onclick = () => showForeignPackages(base, target);
      if(hasPackages) note(`📦 패키지로 묶어 들으면 더 알차요 · ${base} 학습자를 위한 ${target} 패키지 ${foreignPkgList.length}종 보기`);
    }
    function showForeignerResult(customCards=null, introText=null) {
      const cards = sortByStars(uniqueCards(customCards || fCardsForLevel(state.fBase, state.fTarget, state.fPurpose, state.fLevel)));

      bubble(introText || '선택하신 조건을 기준으로 실제 보유 강좌 안에서 우선 추천을 골랐어요.');
      const parts = [state.fBase, state.fTarget, state.fPurpose, state.fLevel].filter(Boolean);
      // 선택 경로 문구 삭제
      if(!cards.length) {
        bubble('정확히 일치하는 추천 카드가 아직 준비되지 않았어요.');
        appendBottomNav();
        return;
      }
      if(cards.length > PAGE_MAIN) helper(`추천 강좌 ${cards.length}개 중 ${PAGE_MAIN}개를 먼저 보여드려요. 아래 [더보기]를 누르면 이어서 보실 수 있어요.`);
      appendMoreBlock(cards, PAGE_MAIN, (c, idx, holder)=> recCard(idx===0?'우선 추천': idx===1?'맞춤 추천':'보조 추천', c[0], c[1], c[2], holder));
      showExtraRecommendationsForeign(state.fBase, state.fTarget, state.fPurpose, state.fLevel, cards.map(c=>c[0]));
      appendBottomNav();
    }
    function kBaseList() { return Object.keys(foreignerCatalog).filter(b => fTargetList(b).includes('한국어')); }
    function kBaseCount(base) { return fCardsForComboAll(base, '한국어').length; }
    function kTotalCount() { return kBaseList().reduce((sum,b)=>sum+kBaseCount(b),0); }
    function kPurposeList(base) { return fPurposeList(base, '한국어'); }
    function kLevelList(base, purpose) { return fLevelList(base, '한국어', purpose); }
    function kCardsForPurposeAll(base, purpose) { return fCardsForPurposeAll(base, '한국어', purpose); }
    function kCardsForBaseAll(base) { return fCardsForComboAll(base, '한국어'); }
    function kCardsForLevel(base, purpose, level) { return fCardsForLevel(base, '한국어', purpose, level); }
    function chooseKoreanBase(label) { state.kBase=label; state.kPurpose=null; state.kLevel=null; clearKPicked(); state.step='kPurpose'; render(); }
    function chooseKoreanPurpose(label) { state.kPurpose=label; state.kLevel=null; state.kPicked={purpose:true,level:false}; state.step='kLevel'; render(); }
    function chooseKoreanLevel(label) { state.kLevel=label; state.kPicked.level=true; state.step='kResult'; render(); }
    function showKoreanResult(customCards=null, introText=null) {
      const cards = sortByStars(uniqueCards(customCards || kCardsForLevel(state.kBase, state.kPurpose, state.kLevel)));
      bubble(introText || '선택하신 조건을 기준으로 실제 보유 강좌 안에서 우선 추천을 골랐어요.');
      const parts = [state.kBase, '한국어', state.kPurpose, state.kLevel].filter(Boolean);
      // 선택 경로 문구 삭제
      if(!cards.length) {
        bubble('정확히 일치하는 추천 카드가 아직 준비되지 않았어요.');
        appendBottomNav();
        return;
      }
      if(cards.length > PAGE_MAIN) helper(`추천 강좌 ${cards.length}개 중 ${PAGE_MAIN}개를 먼저 보여드려요. 아래 [더보기]를 누르면 이어서 보실 수 있어요.`);
      appendMoreBlock(cards, PAGE_MAIN, (c, idx, holder)=> recCard(idx===0?'우선 추천': idx===1?'맞춤 추천':'보조 추천', c[0], c[1], c[2], holder));
      showExtraRecommendationsForeign(state.kBase, '한국어', state.kPurpose, state.kLevel, cards.map(c=>c[0]));
      appendBottomNav();
    }
    function chooseRegion(label) { state.region=label; render(); }
    function chooseExtra(label) { state.lang=label; state.purpose=null; state.exam=null; state.target=null; clearPicked(); state.step='purpose'; render(); }
    function choosePackagePurpose() {
      state.purpose=null; state.exam=null; state.target=null;
      clearPicked(); state.step='package'; render();
    }
    function choosePurpose(label) { state.purpose=label; state.exam=null; state.target=null; state.picked={purpose:true,exam:false,target:false}; state.step=(label==='시험 대비' ? 'exam' : 'target'); render(); }
    function chooseExam(label) { state.exam=label; state.target=null; state.picked.exam=true; state.picked.target=false; state.step='target'; render(); }
    function chooseTarget(label) { state.target=label; state.picked.target=true; state.step='result'; render(); }
    function goBack() {
      if(state.step==='package') { state.step='purpose'; render(); return; }
      if(state.step==='culture') {
        if(state.cultureCountry) { state.cultureCountry=null; render(); return; }
        state.step='lang'; render(); return;
      }
      if(state.step==='foreigner') { state.fBase=null; clearFPicked(); state.step='lang'; render(); return; }
      if(['fTarget','fPurpose','fLevel','fResult'].includes(state.step)) {
        const p = state.fPicked || {};
        if(p.level) { state.fLevel=null; state.fPicked.level=false; state.step='fLevel'; render(); return; }
        if(p.purpose) { state.fPurpose=null; state.fLevel=null; state.fPicked.purpose=false; state.fPicked.level=false; state.step='fPurpose'; render(); return; }
        if(p.target) { state.fTarget=null; state.fPurpose=null; state.fLevel=null; clearFPicked(); state.step='fTarget'; render(); return; }
        state.fBase=null; state.fTarget=null; state.fPurpose=null; state.fLevel=null; clearFPicked(); state.step='foreigner'; render(); return;
      }
      if(state.step==='korean') { state.kBase=null; clearKPicked(); state.step='lang'; render(); return; }
      if(['kPurpose','kLevel','kResult'].includes(state.step)) {
        const p = state.kPicked || {};
        if(p.level) { state.kLevel=null; state.kPicked.level=false; state.step='kLevel'; render(); return; }
        if(p.purpose) { state.kPurpose=null; state.kLevel=null; clearKPicked(); state.step='kPurpose'; render(); return; }
        state.kBase=null; state.kPurpose=null; state.kLevel=null; clearKPicked(); state.step='korean'; render(); return;
      }
      if(state.step==='extraLang') {
        // 대륙을 고른 상태면 대륙 목록으로, 아니면 첫 화면으로
        if(state.region) { state.region=null; render(); return; }
        state.step='lang'; render(); return;
      }
      // 언어 → 목적 → (시험) → 수준 흐름은 사용자가 실제로 고른 단계만 되짚어 갑니다.
      if(state.picked && state.picked.target) {
        state.target=null; state.picked.target=false; state.step='target'; render(); return;
      }
      if(state.picked && state.picked.exam) {
        state.exam=null; state.target=null; state.picked.exam=false; state.picked.target=false; state.step='exam'; render(); return;
      }
      if(state.picked && state.picked.purpose) {
        state.purpose=null; state.exam=null; state.target=null; clearPicked(); state.step='purpose'; render(); return;
      }
      // 더 되돌아갈 단계가 없으면, 기타 언어로 들어왔을 땐 대륙별 목록으로 돌려보냅니다.
      state.lang=null; state.purpose=null; state.exam=null; state.target=null; clearPicked();
      state.step = state.region ? 'extraLang' : 'lang';
      render();
    }
    function normalizeCourseSearch(query) {
      const raw = String(query || '').trim();
      const compact = raw.toLowerCase().replace(/[\s._-]+/g, '');
      const aliases = {
        '토익':'toeic',
        'toeic':'toeic',
        '토익스피킹':'toeicspeaking',
        '토익스피킹시험':'toeicspeaking',
        'toeicspeaking':'toeicspeaking',
        'topik':'topik',
        '토픽':'topik',
        'cils':'cils',
        'dele':'dele',
        'hsk':'hsk',
        'opi':'opi',
        'opic':'opic'
      };
      return aliases[compact] || compact;
    }
    function searchableText(text) {
      return String(text || '').toLowerCase().replace(/[\s._-]+/g, '');
    }
    function keywordCourseResults(query) {
      const key = normalizeCourseSearch(query);
      if(!key) return [];
      const supported = ['topik','toeic','toeicspeaking','cils','dele','hsk','opi','opic'];
      if(!supported.includes(key)) return [];
      const results = Object.keys(courseUrls).filter(title => {
        const text = searchableText(title);
        if(key === 'toeicspeaking') return text.includes('toeicspeaking') || text.includes('토익스피킹');
        if(key === 'toeic') return (text.includes('toeic') || text.includes('토익')) && !text.includes('toeicspeaking') && !text.includes('토익스피킹');
        if(key === 'opi') return text.includes('opi') && !text.includes('opic') && !text.includes('topik');
        if(key === 'opic') return text.includes('opic');
        return text.includes(key);
      });
      // 토익스피킹 검색 시 기존 목록 하단의 3개 강좌를 우선 노출
      if(key === 'toeicspeaking') {
        const priority = [
          'The 빠른 Toeic Speaking - IM',
          'The 빠른 Toeic Speaking - IH',
          'The 빠른 Toeic Speaking - 실전모의고사'
        ];
        return results.sort((a, b) => {
          const ai = priority.indexOf(a);
          const bi = priority.indexOf(b);
          if(ai !== -1 && bi !== -1) return ai - bi;
          if(ai !== -1) return -1;
          if(bi !== -1) return 1;
          return 0;
        });
      }
      // HSK 검색 시 '최강 新HSK 4급'은 항상 맨 마지막에 노출
      if(key === 'hsk') {
        const lastTitle = '최강 新HSK 4급';
        return results.sort((a, b) => {
          if(a === lastTitle && b !== lastTitle) return 1;
          if(b === lastTitle && a !== lastTitle) return -1;
          return 0;
        });
      }
      return results;
    }
    function keywordPackages(query) {
      const key = normalizeCourseSearch(query);
      return packages.filter(p => {
        const hay = searchableText([p.title, ...(p.exams || [])].join(' '));
        if(key === 'toeicspeaking') return hay.includes('toeicspeaking') || hay.includes('토익스피킹');
        if(key === 'toeic') return (hay.includes('toeic') || hay.includes('토익')) && !hay.includes('toeicspeaking') && !hay.includes('토익스피킹');
        if(key === 'opi') return hay.includes('opi') && !hay.includes('opic') && !hay.includes('topik');
        if(key === 'opic') return hay.includes('opic');
        return hay.includes(key);
      });
    }
    function findOriginalCourseCard(title) {
      const roots = [catalog, examCatalog, foreignerCatalog];
      const findIn = (node) => {
        if(Array.isArray(node)) {
          if(node.length >= 3 && node[0] === title && typeof node[1] === 'string' && typeof node[2] === 'string') return node;
          for(const item of node) {
            const found = findIn(item);
            if(found) return found;
          }
          return null;
        }
        if(node && typeof node === 'object') {
          for(const value of Object.values(node)) {
            const found = findIn(value);
            if(found) return found;
          }
        }
        return null;
      };
      for(const root of roots) {
        const found = findIn(root);
        if(found) return found;
      }
      return null;
    }

    function showKeywordSearch(query) {
      const titles = keywordCourseResults(query);
      const pkgList = keywordPackages(query);
      body.innerHTML = '';
      bubble(`🔎 “${String(query).trim()}” 관련 강좌를 모아봤어요.`);
      if(titles.length) {
        appendMoreBlock(titles, PAGE_MAIN, (t, i, holder) => {
          const originalCard = findOriginalCourseCard(t);
          const focus = originalCard ? originalCard[1] : `${titleMeta(t).purpose || '시험 대비'} · ${titleMeta(t).level || '전체'}`;
          const reason = originalCard ? originalCard[2] : '현재 검색 조건에 맞는 강좌예요.';
          recCard('검색 결과', t, focus, reason, holder);
        });
      } else {
        bubble('해당 검색어가 들어간 강좌는 아직 등록되어 있지 않아요.');
      }
      if(pkgList.length) {
        const wrap = document.createElement('div');
        wrap.className = 'eckv3-btns';
        wrap.innerHTML = '<button class="eckv3-btn eckv3-primary" id="eckv3-keywordPackageBtn">📦 패키지 보기</button>';
        body.appendChild(wrap);
        eckv3ById('eckv3-keywordPackageBtn').onclick = () => {
          const keywordPackageIntroRow = bubble(`📦 “${String(query).trim()}” 관련 패키지예요.`);
          keywordPackageIntroRow.style.setProperty('margin-top','12px','important');
          appendMoreBlock(pkgList, PAGE_MAIN, (p, i, holder) => pkgCard(p, holder));
        };
        note(`관련 패키지 ${pkgList.length}종도 확인할 수 있어요.`);
      }
      appendBottomNav();
      scrollToTop();
    }
    function submitLangSearch() {
      const input = eckv3ById('eckv3-langSearch');
      const query = input ? input.value : '';

      // 국가 이름으로 검색하면 해당 국가의 이문화 특강으로 바로 이동합니다.
      // 예: 에스토니아, 슬로바키아, 일본, 일본 이문화 특강
      const normalizedCountryQuery = String(query || '').trim()
        .replace(/\s*(?:이문화\s*특강|문화\s*특강)\s*$/g, '').trim();
      const foundCountry = Object.keys(cultureCatalog).find(country =>
        searchableText(country) === searchableText(normalizedCountryQuery)
      );
      if(foundCountry) {
        if(input) input.value = '';
        state.cultureCountry = foundCountry;
        state.step = 'culture';
        render();
        return;
      }

      // 1순위: 언어명 검색. 영어/중국어/일본어/베트남어처럼 언어를 입력하면
      // 기존 언어 분류 화면을 그대로 불러옵니다.
      const lang = resolveLang(query);
      if(lang) {
        if(input) input.value = '';
        if(['한국어', '외국인을 위한 강좌', '이문화 특강', '기타 언어'].includes(lang)) {
          chooseLang(lang);
          return;
        }
        state.lang = lang;
        state.purpose=null; state.exam=null; state.target=null; state.region=null;
        clearPicked(); state.step='purpose'; render();
        return;
      }

      // 2순위: 시험/강좌 키워드 검색.
      const keywordResults = keywordCourseResults(query);
      const keywordPkgResults = keywordPackages(query);
      const keyword = normalizeCourseSearch(query);
      const supportedKeywords = ['topik','toeic','toeicspeaking','cils','dele','hsk','opi','opic'];
      if(keywordResults.length || keywordPkgResults.length || supportedKeywords.includes(keyword)) {
        if(input) input.value = '';
        showKeywordSearch(query);
        return;
      }

      bubble('검색한 언어나 강좌 키워드를 찾지 못했어요. 다른 표기로 다시 확인해 주세요.');
      if(input) input.value = '';
    }
    // 챗봇이 닫혀 있을 때만 아이콘 위 말풍선을 보여줍니다.
    const launcherTip = eckv3ById('eckv3-launcherTip');
    let tipDismissed = false;
    function syncLauncherTip() {
      if(!launcherTip) return;
      launcherTip.classList.toggle('eckv3-hidden', state.open || tipDismissed);
    }
    eckv3ById('eckv3-launcher').addEventListener('click', function () {
      state.open = !state.open;
      chat.classList.toggle('eckv3-hidden', !state.open);
      syncLauncherTip();
    });
    if(launcherTip) {
      launcherTip.addEventListener('click', function (e) {
        if(e.target.id === 'eckv3-launcherTipClose') return;
        state.open = true;
        chat.classList.remove('eckv3-hidden');
        syncLauncherTip();
      });
      launcherTip.addEventListener('keydown', function (e) {
        if(e.key==='Enter' || e.key===' ') { e.preventDefault(); launcherTip.click(); }
      });
      const tipClose = eckv3ById('eckv3-launcherTipClose');
      tipClose.addEventListener('click', function (e) {
        e.stopPropagation();
        tipDismissed = true;
        syncLauncherTip();
      });
      tipClose.addEventListener('keydown', function (e) {
        if(e.key==='Enter' || e.key===' ') { e.preventDefault(); e.stopPropagation(); tipClose.click(); }
      });
    }
    eckv3ById('eckv3-close').addEventListener('click', function () {
      state.open = false;
      chat.classList.add('eckv3-hidden');
      syncLauncherTip();
    });
    eckv3ById('eckv3-reset').onclick=resetAll;
    ['eckv3-close','eckv3-reset'].forEach(id => {
      eckv3ById(id).addEventListener('keydown', (e) => {
        if(e.key==='Enter' || e.key===' ') { e.preventDefault(); eckv3ById(id).click(); }
      });
    });
    eckv3ById('eckv3-langSearchBtn').onclick=submitLangSearch;
    eckv3ById('eckv3-langSearch').addEventListener('keydown', (e)=>{ if(e.key==='Enter') submitLangSearch(); });
    syncLauncherTip();
    render();
    })();
  </script>
</div>
